# Build the iOS app on Expo's servers and send it to TestFlight — no PC needed.
# Start it from GitHub (Actions → "TestFlight build" → Run workflow) or have Claude run it.
# One-time setup: repo secret EXPO_TOKEN, and App Store Connect API key + push key stored on EAS (eas credentials).
name: TestFlight build
on:
  workflow_dispatch:
    inputs:
      note:
        description: What's in this build (optional)
        required: false
      submit_build_id:
        description: Only send this already-built EAS build to TestFlight (no new build)
        required: false
concurrency: { group: testflight, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Send an existing build to TestFlight
        if: ${{ github.event.inputs.submit_build_id != '' }}
        run: |
          ID="${{ github.event.inputs.submit_build_id }}"
          for i in $(seq 1 60); do
            S=$(eas build:view "$ID" --json --non-interactive | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).status))")
            echo "build $ID: $S"
            [ "$S" = "FINISHED" ] && break
            case "$S" in ERRORED|CANCELED) exit 1;; esac
            sleep 30
          done
          eas submit -p ios --id "$ID" --non-interactive
      - run: npx tsc --noEmit
        if: ${{ github.event.inputs.submit_build_id == '' }}
        continue-on-error: true # report type problems, don't block a build over them
      - run: npm test
        if: ${{ github.event.inputs.submit_build_id == '' }}
      # --no-wait: the build and the TestFlight upload carry on at Expo; this job just starts them.
      - if: ${{ github.event.inputs.submit_build_id == '' }}
        run: eas build -p ios --profile production --non-interactive --auto-submit --no-wait --message "${{ github.event.inputs.note || 'TestFlight build' }}"
